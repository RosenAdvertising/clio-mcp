name: gitleaks
on:
  # Branch pushes only. Pushes to main/master and every pull request are
  # already covered by the fleet CI `secrets` job, which runs the identical
  # gitleaks 8.21.2 command; scanning them here too would just duplicate it.
  # This workflow keeps the coverage the fleet caller does not have: a push
  # to a branch that has no pull request open yet.
  push:
    branches-ignore: [main, master]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (secret scan)
        run: |
          set -euo pipefail
          VER=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o "gitleaks_${VER}_linux_x64.tar.gz"
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks_${VER}_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf "gitleaks_${VER}_linux_x64.tar.gz" gitleaks
          ./gitleaks detect --source . --no-banner --redact --exit-code 1
