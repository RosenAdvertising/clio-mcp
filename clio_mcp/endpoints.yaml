  - name: add_relationship
    method: POST
    path: /api/v4/relationships
    allowed_fields:
      - id
      - description
      - "matter{id}"
      - "contact{id,name}"
    requested_fields:
      - id
      - description
      - "matter{id}"
      - "contact{id,name}"
    required_params: [matter_id, contact_id, description]
    optional_params: []
    response_shape: { data: object }
    read_write: write

  # ── Timers ────────────────────────────────────────────────────────────────
  # IMPORTANT: timer resource does NOT support matter{...} or user{...} expansion.
  # Schema: id/etag/start_time/elapsed_time/created_at/updated_at only.
  # Clio rejects this expansion.

  - name: list_timers
    method: GET
    path: /api/v4/timer
    allowed_fields: [id, etag, start_time, elapsed_time, created_at, updated_at]
    requested_fields:
      [id, etag, start_time, elapsed_time, created_at, updated_at]
    required_params: []
    optional_params: []
    response_shape: { data: object }
    read_write: read

  - name: start_timer
    method: POST
    path: /api/v4/timer
    allowed_fields: [id, etag, start_time, elapsed_time, created_at, updated_at]
    requested_fields:
      [id, etag, start_time, elapsed_time, created_at, updated_at]
    required_params: [matter_id]
    optional_params: []
    response_shape: { data: object }
    read_write: write

  - name: stop_timer
    method: DELETE
    path: /api/v4/timer
    allowed_fields: []
    requested_fields: []
    required_params: []
    optional_params: []
    response_shape: {}
    read_write: write
