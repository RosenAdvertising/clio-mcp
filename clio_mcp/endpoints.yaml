    optional_params: [date, quantity, non_billable]
    response_shape: { data: object }
    read_write: write

  # ── Billing ───────────────────────────────────────────────────────────────
  # IMPORTANT: bills resource does NOT support matter{...} expansion.
  # Use client{id,name} for client context. Clio rejects this expansion.

  - name: list_bills
    method: GET
    path: /api/v4/bills
    allowed_fields:
      - id
      - number
      - subject
      - state
      - issued_at
      - due_at
      - total
      - balance
      - "client{id,name}"
    requested_fields:
      - id
      - number
      - subject
      - state
      - issued_at
      - due_at
      - total
      - balance
      - "client{id,name}"
    required_params: []
    optional_params:
      [
        status,
        overdue,
        matter_id,
        client_id,
        issued_after,
        issued_before,
        created_since,
        updated_since,
        order,
        limit,
      ]
    response_shape: { data: list }
    read_write: read

  # ── Documents ─────────────────────────────────────────────────────────────

  - name: list_documents
    method: GET
    path: /api/v4/documents
    allowed_fields:
      - id
      - name
      - content_type
      - created_at
      - updated_at
      - "matter{id,display_number}"
    requested_fields:
      - id
      - name
      - content_type
      - created_at
      - updated_at
      - "matter{id,display_number}"
    required_params: []
    optional_params:
      [matter_id, query, created_since, updated_since, order, limit]
    response_shape: { data: list }
    read_write: read

  - name: upload_document_create
    method: POST
    path: /api/v4/documents
    allowed_fields:
      - id
      - name
      - "latest_document_version{id,put_url}"
    requested_fields:
      - id
      - name
      - "latest_document_version{id,put_url}"
    required_params: [file_path]
    optional_params: [filename, matter_id, folder_id]
    response_shape: { data: object }
    read_write: write

  - name: upload_document_finalize
    method: PATCH
    path: /api/v4/documents/{id}
    allowed_fields:
      - id
      - name
      - "matter{id,display_number}"
    requested_fields:
      - id
      - name
      - "matter{id,display_number}"
    required_params: [document_id]
    optional_params: []
    response_shape: { data: object }
    read_write: write

  - name: download_document
    method: GET
    path: /api/v4/documents/{id}
    allowed_fields:
      - id
      - name
      - "latest_document_version{id,filename,download_url}"
    requested_fields:
      - id
      - name
      - "latest_document_version{id,filename,download_url}"
    required_params: [document_id]
    optional_params: [output_path]
    response_shape: { data: object }
    read_write: read

  # ── Notes ─────────────────────────────────────────────────────────────────

  - name: list_notes
    method: GET
    path: /api/v4/notes
    allowed_fields:
      - id
      - subject
      - detail
      - type
      - date
      - "matter{id,display_number}"
    requested_fields:
      - id
      - subject
      - detail
      - type
      - date
      - "matter{id,display_number}"
    required_params: []
    optional_params:
      [matter_id, contact_id, created_since, updated_since, order, limit]
    response_shape: { data: list }
    read_write: read

  - name: create_note
    method: POST
    path: /api/v4/notes
    allowed_fields: [id, subject, detail, type, date]
    requested_fields: [id, subject, detail, type, date]
    required_params: [subject, detail]
    optional_params: [note_type, matter_id, contact_id]
    response_shape: { data: object }
    read_write: write

  # ── Utility ───────────────────────────────────────────────────────────────

  - name: list_practice_areas
    method: GET
    path: /api/v4/practice_areas
    allowed_fields: [id, name]
    requested_fields: [id, name]
    required_params: []
    optional_params: []
    response_shape: { data: list }
    read_write: read

  - name: list_users
    method: GET
    path: /api/v4/users
    allowed_fields: [id, name, email, enabled]
    requested_fields: [id, name, email, enabled]
    required_params: []
    optional_params: [limit]
    response_shape: { data: list }
    read_write: read

  - name: list_communications
    method: GET
    path: /api/v4/communications
    allowed_fields:
