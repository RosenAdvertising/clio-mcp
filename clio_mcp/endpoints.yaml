      - date
      - "matter{id,display_number}"
      - "senders{id,name}"
      - "receivers{id,name}"
    requested_fields:
      - id
      - subject
      - body
      - type
      - date
      - "matter{id,display_number}"
      - "senders{id,name}"
      - "receivers{id,name}"
    required_params: []
    optional_params:
      [
        matter_id,
        received_since,
        received_before,
        created_since,
        updated_since,
        order,
        limit,
      ]
    response_shape: { data: list }
