[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clio-mcp"
version = "0.1.0"
description = "MCP server for Clio Manage API — full CRUD for law firms"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["clio", "mcp", "legal", "law", "claude"]
dependencies = [
    "cryptography>=49.0.0",
    "mcp==2.3.0",
    "requests>=2.34.2",
    "pyyaml>=6.0.3",
    "keyring>=25.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.16,<0.17",
]

[project.scripts]
clio-mcp = "clio_mcp.server:main"
clio-mcp-setup = "clio_mcp.setup.oauth_flow:main"
clio-mcp-verify = "clio_mcp.setup.verify:main"

[project.urls]
Homepage = "https://github.com/RosenAdvertising/clio-mcp"
Issues = "https://github.com/RosenAdvertising/clio-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["clio_mcp"]

[tool.pyright]
include = ["."]
exclude = ["**/node_modules", "**/__pycache__", ".venv", "venv", "dist", "build"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingImports = false
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
