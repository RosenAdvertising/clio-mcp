[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clio-mcp"
version = "0.1.0"
description = "MCP server for Clio: matters, contacts, tasks, time and billing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["clio", "mcp", "legal", "law", "claude"]
classifiers = [
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
]
dependencies = [
    "cryptography>=49.0.0",
    "mcp>=2.3,<3",
    "requests>=2.34.2",
    "pyyaml>=6.0.3",
    "keyring>=25.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.17,<0.18",
]

[project.scripts]
clio-mcp = "clio_mcp.server:main"
clio-mcp-setup = "clio_mcp.setup.oauth_flow:main"
clio-mcp-verify = "clio_mcp.setup.verify:main"

[project.urls]
Homepage = "https://github.com/RosenAdvertising/clio-mcp"
Repository = "https://github.com/RosenAdvertising/clio-mcp"
Issues = "https://github.com/RosenAdvertising/clio-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["clio_mcp"]

[tool.pyright]
include = ["."]
exclude = ["**/node_modules", "**/__pycache__", ".venv", "venv", "dist", "build"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingImports = false
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
